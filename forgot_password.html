<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Forgot Password - Coastal Land Watch</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

    <style>
        /* MINIMALIST DESIGN */
        :root {
            --color-bg: #EAECEF;
            --color-primary: #000000;
            --color-accent: #F3F4F6;
            --color-text-main: #111111;
            --color-text-muted: #555555;
        }

        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: var(--color-bg); 
            margin: 0; padding: 0; min-height: 100vh;
            display: flex; flex-direction: column;
        }

        .header-bg {
            background: var(--color-bg);
            padding: 50px 20px 30px; text-align: center; position: relative;
        }

        .back-btn {
            position: absolute; top: 25px; left: 20px;
            color: var(--color-text-main); text-decoration: none;
            display: flex; align-items: center; gap: 5px;
            font-size: 15px; font-weight: 800; background: #fff;
            padding: 8px 14px; border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .logo-box {
            width: 70px; height: 70px; border-radius: 20px; 
            background: var(--color-primary); margin: 0 auto 15px; 
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .logo-box i { font-size: 34px; color: #fff; }
        
        .header-bg h1 { color: var(--color-primary); font-size: 24px; margin: 0; font-weight: 800; }
        .header-bg p { color: var(--color-text-muted); font-size: 14px; margin: 6px 0 0; font-weight: 600; line-height: 1.5; padding: 0 10px; }

        .form-body { 
            background: #ffffff;
            border-top-left-radius: 35px; border-top-right-radius: 35px;
            padding: 40px 24px 60px; flex: 1;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.05);
        }

        .input-label { font-size: 14px; font-weight: 800; color: var(--color-text-main); margin: 0 0 8px; display: block; }
        
        .input-field {
            background: var(--color-accent); border: 2px solid transparent; 
            border-radius: 14px; padding: 18px; font-size: 15px; font-weight: 500;
            color: var(--color-text-main); width: 100%; box-sizing: border-box; 
            margin-bottom: 24px; transition: 0.2s;
        }
        .input-field:focus { outline: none; border-color: var(--color-primary); background: #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }

        .btn-black {
            background: var(--color-primary); color: #fff; border: none; 
            border-radius: 16px; padding: 18px; width: 100%; font-size: 16px; 
            font-weight: 800; cursor: pointer; transition: 0.2s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            margin-top: 10px;
        }
        .btn-black:active { transform: scale(0.96); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <div class="header-bg">
        <a href="login.html" class="back-btn"><i class="ti ti-arrow-left"></i> Back</a>
        <div class="logo-box">
            <i class="ti ti-shield-check"></i>
        </div>
        <h1>Reset Password</h1>
        <p>Verify your identity using your registered Phone Number and Date of Birth to create a new password.</p>
    </div>

    <div class="form-body">
        <form id="forgotPasswordForm">
            
            <p style="font-size: 13px; color: #DC2626; font-weight: 700; text-align: center; margin-bottom: 20px;">
                <i class="ti ti-alert-circle"></i> All fields must match your registered account.
            </p>

            <label class="input-label">Username</label>
            <input type="text" id="reset_username" class="input-field" placeholder="Enter your username" required>

            <label class="input-label">Phone Number</label>
            <input type="tel" id="reset_phone" class="input-field" placeholder="09XX XXX XXXX" required>

            <label class="input-label">Date of Birth</label>
            <input type="date" id="reset_dob" class="input-field" required>

            <div style="height: 1px; background: #E5E7EB; margin: 10px 0 30px;"></div>

            <label class="input-label">New Password</label>
            <input type="password" id="reset_new_password" class="input-field" placeholder="Enter new password" required>

            <button type="submit" class="btn-black">Reset My Password</button>
        </form>
    </div>

    <script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            
            const submitBtn = document.querySelector('.btn-black');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = "Verifying & Updating...";
            submitBtn.disabled = true;

            // Kukunin ang lahat ng impormasyon para i-verify sa server
            const payload = {
                username: document.getElementById('reset_username').value,
                phone: document.getElementById('reset_phone').value,
                dob: document.getElementById('reset_dob').value,
                new_password: document.getElementById('reset_new_password').value
            };

            try {
                // Siguraduhing tama ang Ngrok link mo rito!
                let response = await fetch('https://unaired-undrilled-shortly.ngrok-free.dev/coastal_land_watch/api_forgot_password.php', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true'
                    },
                    body: JSON.stringify(payload)
                });

                let result = await response.json();

                if (result.status === 'success') {
                    alert('✅ ' + result.message);
                    // Ibalik agad sa login form kapag successful!
                    window.location.href = "login.html";
                } else {
                    alert('⚠️ ' + result.message);
                }

            } catch (error) {
                alert("Network Error: Make sure your XAMPP and Ngrok are running.");
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
