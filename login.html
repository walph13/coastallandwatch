<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - Coastal Land Watch</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
    
    <!-- Required for the app to save your login session! -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>

    <style>
        :root {
            --bg-color: #F2EFE9; 
            --card-white: #FFFFFF;
            --card-lime: #D9FA4A; 
            --text-dark: #1A1A1A;
            --text-gray: #6B7280;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: var(--bg-color); 
            display: flex; align-items: center; justify-content: center; 
            min-height: 100vh; margin: 0; padding: 20px;
        }

        .login-card { 
            background: var(--card-white); 
            padding: 40px 24px; 
            border-radius: 32px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.03); 
            width: 100%; max-width: 440px; 
        }

        .brand-logo {
            width: 100px; height: 100px; object-fit: cover;
            border-radius: 50%; /* Makes the logo a perfect circle like your web app */
            margin-bottom: 24px;
            border: 3px solid #ECEFF1;
            background-color: #fff;
            padding: 2px;
        }

        .system-title { font-weight: 700; color: var(--text-dark); font-size: 26px; margin-bottom: 8px; letter-spacing: -0.5px; }
        .system-subtitle { color: var(--text-gray); font-size: 14px; font-weight: 500; margin-bottom: 32px; }
        
        .form-label { font-weight: 600; color: var(--text-dark); font-size: 14px; margin-bottom: 8px; text-align: left; display: block; }
        
        .custom-input { 
            border-radius: 16px; border: 1px solid #E5E7EB; 
            padding: 14px 16px; background-color: #F9FAFB; 
            color: var(--text-dark); transition: 0.2s; box-shadow: none !important;
            font-size: 15px;
        }
        .custom-input:focus { border-color: var(--text-dark); background-color: #fff; }
        
        .input-group .custom-input { border-right: none; border-top-right-radius: 0; border-bottom-right-radius: 0; }
        .custom-input-btn { 
            border-color: #E5E7EB; background-color: #F9FAFB; 
            border-left: none; border-top-right-radius: 16px; border-bottom-right-radius: 16px; 
            color: var(--text-gray); padding: 0 16px;
        }
        .custom-input:focus + .custom-input-btn { border-color: var(--text-dark); background-color: #fff; }

        .btn-login { 
            background-color: var(--text-dark); color: var(--card-lime); 
            border: none; border-radius: 30px; 
            font-weight: 600; font-size: 16px; padding: 16px;
            transition: 0.2s; margin-top: 8px; width: 100%;
        }
        .btn-login:active { transform: scale(0.98); opacity: 0.9; }

        .forgot-link { font-size: 13px; font-weight: 600; color: var(--text-gray); text-decoration: none; transition: 0.2s; float: right; margin-bottom: 24px;}
        .forgot-link:active { color: var(--text-dark); }

        .register-text { font-size: 14px; color: var(--text-gray); margin-top: 32px; font-weight: 500; text-align: center;}
        .register-link { color: var(--text-dark); font-weight: 700; text-decoration: none; border-bottom: 2px solid var(--card-lime); padding-bottom: 2px; }
        
        /* Mobile Error Box */
        #loginError { display: none; border-radius: 16px; font-size: 14px; font-weight: 500; text-align: center; border: none; background: #FCE8E8; color: #DC2626; padding: 12px; margin-bottom: 20px;}
    </style>
</head>
<body>

    <div class="login-card text-center">
        <!-- Make sure tanzalogo.jpg is in your www folder! -->
        <img src="tanzalogo.jpg" alt="Logo" class="brand-logo" onerror="this.src='https://via.placeholder.com/100'">
        
        <h2 class="system-title">Welcome back</h2>
        <p class="system-subtitle">Barangay Coastal & Land Watch</p>

        <div id="loginError"><i class="ti ti-x"></i> <span id="errorText"></span></div>

        <form id="loginForm" style="text-align: left;">
            <div class="mb-3">
                <label class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-control custom-input" placeholder="Enter your username" required>
            </div>

            <div class="mb-2">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <input type="password" id="password" name="password" class="form-control custom-input" placeholder="••••••••" required>
                    <button class="btn btn-outline-secondary custom-input-btn" type="button" id="togglePassword">
                        <i class="ti ti-eye"></i>
                    </button>
                </div>
            </div>

            <div style="overflow: hidden;">
                <a href="forgot_password.html" class="forgot-link">Forgot Password?</a>
            </div>

            <button type="submit" id="loginBtn" class="btn-login">
                Log In
            </button>
        </form>

        <div class="register-text">
            Don't have an account? <a href="register.html" class="register-link">Register Here</a>
        </div>
    </div>

    <!-- SCRIPT 1: Eye Icon Toggle -->
    <script>
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');

        togglePassword.addEventListener('click', function () {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.innerHTML = type === 'password' ? '<i class="ti ti-eye"></i>' : '<i class="ti ti-eye-off"></i>';
        });
    </script>
    
    <!-- SCRIPT 2: JSON Login Fetch -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 

            const loginBtn = document.getElementById('loginBtn');
            const errorBox = document.getElementById('loginError');
            const errorText = document.getElementById('errorText');
            
            const usernameVal = document.getElementById('username').value;
            const passwordVal = document.getElementById('password').value;

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="ti ti-loader spinner"></i> Verifying...';
            errorBox.style.display = 'none';

            try {
                let response = await fetch('https://unaired-undrilled-shortly.ngrok-free.dev/coastal_land_watch/api_login.php', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'text/plain',
                        'ngrok-skip-browser-warning': 'true'
                    },
                    body: JSON.stringify({
                        username: usernameVal,
                        password: passwordVal
                    })
                });

                let rawText = await response.text();
                let result;
                
                try {
                    result = JSON.parse(rawText);
                } catch(err) {
                    console.error("PHP Error:", rawText);
                    errorText.innerText = "Server Error. Check console.";
                    errorBox.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = 'Log In';
                    return;
                }

                if (result.status === 'success') {
                    await localforage.setItem('user_session', result.user);
                    window.location.replace('index.html');
                } else {
                    errorText.innerText = result.message;
                    errorBox.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = 'Log In';
                }

            } catch (error) {
                errorText.innerText = "Network Error. Please check your internet connection.";
                errorBox.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Log In';
            }
        });
    </script>
    
    <!-- Leave app.js link for global functions -->
    <script src="js/app.js"></script>
</body>
</html>
