<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#3F4D67">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Login - Coastal Land Watch</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/localforage/1.10.0/localforage.min.js"></script>

    <script src="js/notify.js"></script>

    <style>
        :root {
            --bg-body: #f4f6fa;
            --bg-surface: #ffffff;
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --primary-light: #e0f2fe;
            --brand-slate: #3F4D67;
            --brand-slate-deep: #2c3850;
            --red-dark: #b91c1c;
            --red-light: #fef2f2;
            --text-main: #172033;
            --text-muted: #64748b;
            --border-color: #e8ecf3;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-body);
            margin: 0; padding: 0; min-height: 100vh;
            display: flex; flex-direction: column;
            color: var(--text-main);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== CURVED HEADER ===== */
        .hero { position: relative; height: calc(var(--safe-top) + 250px); flex-shrink: 0; color: #fff; }
        .hero-curve { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
        .hero-inner { position: relative; z-index: 2; padding: calc(var(--safe-top) + 78px) 28px 0; }

        .back-btn {
            position: absolute; z-index: 3; top: calc(var(--safe-top) + 18px); left: 20px;
            width: 42px; height: 42px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #fff; text-decoration: none; font-size: 20px;
            background: rgba(255, 255, 255, 0.14); border: 1px solid rgba(255, 255, 255, 0.25);
            transition: background 0.2s;
        }
        .back-btn:active { background: rgba(255, 255, 255, 0.28); }

        .brand { font-size: 22px; font-weight: 500; letter-spacing: 0.22em; line-height: 1.35; text-transform: uppercase; }
        .hero p { margin: 10px 0 0; font-size: 14px; font-weight: 500; color: rgba(255, 255, 255, 0.78); line-height: 1.5; max-width: 270px; }

        /* ===== PAGE BODY ===== */
        .page { flex: 1; display: flex; flex-direction: column; padding: 6px 24px calc(28px + var(--safe-bottom)); }
        .page h2 { margin: 0 0 22px; font-size: 32px; font-weight: 600; letter-spacing: -0.8px; color: var(--text-main); }

        .input-label { font-size: 13.5px; font-weight: 600; color: var(--text-main); margin: 0 0 8px; display: block; }

        .input-field {
            background: #ffffff; border: 1.5px solid transparent; border-radius: 16px;
            padding: 16px; font-size: 14px; font-family: inherit; font-weight: 500;
            color: var(--text-main); width: 100%; margin-bottom: 18px;
            box-shadow: 0 4px 16px rgba(23, 32, 51, 0.07); transition: 0.2s; appearance: none; -webkit-appearance: none;
        }
        .input-field::placeholder { color: #a3adbd; font-weight: 400; }
        .input-field:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-light); }
        input[type="date"].input-field { min-height: 52px; }

        .pw-wrap { position: relative; margin-bottom: 14px; }
        .pw-wrap .input-field { margin-bottom: 0; padding-right: 48px; }
        .pw-wrap i { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 20px; color: var(--text-muted); cursor: pointer; }

        .btn-main {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #ffffff; border: none; border-radius: 999px;
            padding: 17px; width: 100%; font-size: 15px; font-weight: 600; font-family: inherit;
            cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 10px 22px rgba(14, 165, 233, 0.32); margin-top: 6px;
        }
        .btn-main:active { transform: scale(0.98); box-shadow: 0 5px 12px rgba(14, 165, 233, 0.3); }
        .btn-main:disabled { background: #cbd5e1; box-shadow: none; cursor: not-allowed; }

        .switch-link { margin-top: auto; padding-top: 26px; text-align: center; font-size: 13.5px; color: var(--text-muted); text-decoration: none; display: block; font-weight: 500; }
        .switch-link span { color: var(--brand-slate); font-weight: 700; }

        /* hero is a little taller on the login screen */
        .hero { height: calc(var(--safe-top) + 300px); }
        .hero-inner { padding-top: calc(var(--safe-top) + 30px); }
        .brand-logo {
            width: 54px; height: 54px; object-fit: cover; border-radius: 50%; display: block; margin-bottom: 26px;
            border: 3px solid rgba(255, 255, 255, 0.35); background: #fff; box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
        }
        .page { padding-top: 0; }

        .pw-wrap button {
            position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
            width: 42px; height: 42px; border: none; background: transparent;
            color: var(--text-muted); font-size: 20px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        .pw-wrap button i { position: static; transform: none; font-size: 20px; color: inherit; }
        .pw-wrap { margin-bottom: 10px; }

        .forgot-row { text-align: right; margin-bottom: 22px; }
        .forgot-link { font-size: 13px; font-weight: 600; color: var(--brand-slate); text-decoration: none; }
        .forgot-link:active { color: var(--primary); }

        #loginError {
            display: none; border-radius: 14px; font-size: 13.5px; font-weight: 500; text-align: center;
            background: var(--red-light); color: var(--red-dark); padding: 14px; margin-bottom: 20px; line-height: 1.45;
        }
        .spinner { display: inline-block; animation: spin 0.9s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

    <div class="hero">
        <svg class="hero-curve" viewBox="0 0 390 300" preserveAspectRatio="none" aria-hidden="true">
            <defs>
                <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#2c3850"/>
                    <stop offset="60%" stop-color="#3F4D67"/>
                    <stop offset="100%" stop-color="#4a5c7c"/>
                </linearGradient>
            </defs>
            <path d="M0,0 H390 V70 C382,190 305,282 190,288 C108,292 44,252 0,205 Z" fill="url(#heroGrad)"/>
            <circle cx="345" cy="40" r="90" fill="rgba(255,255,255,0.06)"/>
            <circle cx="30" cy="225" r="70" fill="rgba(14,165,233,0.16)"/>
        </svg>
        <div class="hero-inner">
            <img src="tanzalogo.jpg" alt="Logo" class="brand-logo" onerror="this.style.display='none'">
            <div class="brand">Coastal<br>Land Watch</div>
            <p>Welcome back! Log in to continue.</p>
        </div>
    </div>

    <div class="page">
        <h2>Login</h2>

        <div id="loginError"><i class="ti ti-alert-circle"></i> <span id="errorText"></span></div>

        <form id="loginForm">
            <label class="input-label">Username</label>
            <input type="text" id="username" name="username" class="input-field" placeholder="Enter your username" autocomplete="username" required>

            <label class="input-label">Password</label>
            <div class="pw-wrap">
                <input type="password" id="password" name="password" class="input-field" placeholder="••••••••" autocomplete="current-password" required>
                <button type="button" id="togglePassword"><i class="ti ti-eye"></i></button>
            </div>

            <div class="forgot-row">
                <a href="forgot_password.html" class="forgot-link">Forgot Password?</a>
            </div>

            <button type="submit" id="loginBtn" class="btn-main">Log In</button>
        </form>

        <div class="switch-link">
            Don't have an account? <a href="register.html" style="text-decoration:none;"><span>Register Here</span></a>
        </div>
    </div>

    <script>
        const togglePassword = document.querySelector('#togglePassword');
        const password = document.querySelector('#password');
        togglePassword.addEventListener('click', function () {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.innerHTML = type === 'password' ? '<i class="ti ti-eye"></i>' : '<i class="ti ti-eye-off"></i>';
        });
    </script>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 
            const loginBtn = document.getElementById('loginBtn');
            const errorBox = document.getElementById('loginError');
            const errorText = document.getElementById('errorText');
            const usernameVal = document.getElementById('username').value;
            const passwordVal = document.getElementById('password').value;

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="ti ti-loader spinner"></i> Verifying...';
            errorBox.style.display = 'none';

            try {
                let response = await fetch('https://unaired-undrilled-shortly.ngrok-free.dev/coastal_land_watch/api_login.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain', 'ngrok-skip-browser-warning': 'true' },
                    body: JSON.stringify({ username: usernameVal, password: passwordVal })
                });

                let rawText = await response.text();
                let result;
                try { result = JSON.parse(rawText); } 
                catch(err) {
                    errorText.innerText = "Server Error. Check console.";
                    errorBox.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = 'Log In';
                    return;
                }

                if (result.status === 'success') {
                    // If the server does not send the profile picture, restore the copy saved on this phone
                    try {
                        const picKey = 'profile_pic_' + (result.user.user_id || result.user.id);
                        if (result.user.profile_pic_data) {
                            await localforage.setItem(picKey, result.user.profile_pic_data);
                        } else {
                            const savedPic = await localforage.getItem(picKey);
                            if (savedPic) result.user.profile_pic_data = savedPic;
                        }
                    } catch (picError) { console.error('Profile picture restore failed:', picError); }

                    await localforage.setItem('user_session', result.user);
                    window.location.replace('index.html');
                } else {
                    errorText.innerText = result.message;
                    errorBox.style.display = 'block';
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = 'Log In';
                }
            } catch (error) {
                errorText.innerText = "Network Error. Please check your internet connection.";
                errorBox.style.display = 'block';
                loginBtn.disabled = false;
                loginBtn.innerHTML = 'Log In';
            }
        });
    </script>
    
    <script src="js/app.js"></script>
</body>
</html>
