<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="theme-color" content="#3F4D67">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Register - Coastal Land Watch</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

    <script src="js/notify.js"></script>

    <style>
        :root {
            --bg-body: #f4f6fa;
            --bg-surface: #ffffff;
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --primary-light: #e0f2fe;
            --brand-slate: #3F4D67;
            --brand-slate-deep: #2c3850;
            --red-dark: #b91c1c;
            --red-light: #fef2f2;
            --text-main: #172033;
            --text-muted: #64748b;
            --border-color: #e8ecf3;
            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-body);
            margin: 0; padding: 0; min-height: 100vh;
            display: flex; flex-direction: column;
            color: var(--text-main);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== CURVED HEADER ===== */
        .hero { position: relative; height: calc(var(--safe-top) + 250px); flex-shrink: 0; color: #fff; }
        .hero-curve { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
        .hero-inner { position: relative; z-index: 2; padding: calc(var(--safe-top) + 78px) 28px 0; }

        .back-btn {
            position: absolute; z-index: 3; top: calc(var(--safe-top) + 18px); left: 20px;
            width: 42px; height: 42px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: #fff; text-decoration: none; font-size: 20px;
            background: rgba(255, 255, 255, 0.14); border: 1px solid rgba(255, 255, 255, 0.25);
            transition: background 0.2s;
        }
        .back-btn:active { background: rgba(255, 255, 255, 0.28); }

        .brand { font-size: 22px; font-weight: 500; letter-spacing: 0.22em; line-height: 1.35; text-transform: uppercase; }
        .hero p { margin: 10px 0 0; font-size: 14px; font-weight: 500; color: rgba(255, 255, 255, 0.78); line-height: 1.5; max-width: 270px; }

        /* ===== PAGE BODY ===== */
        .page { flex: 1; display: flex; flex-direction: column; padding: 6px 24px calc(28px + var(--safe-bottom)); }
        .page h2 { margin: 0 0 22px; font-size: 32px; font-weight: 600; letter-spacing: -0.8px; color: var(--text-main); }

        .input-label { font-size: 13.5px; font-weight: 600; color: var(--text-main); margin: 0 0 8px; display: block; }

        .input-field {
            background: #ffffff; border: 1.5px solid transparent; border-radius: 16px;
            padding: 16px; font-size: 14px; font-family: inherit; font-weight: 500;
            color: var(--text-main); width: 100%; margin-bottom: 18px;
            box-shadow: 0 4px 16px rgba(23, 32, 51, 0.07); transition: 0.2s; appearance: none; -webkit-appearance: none;
        }
        .input-field::placeholder { color: #a3adbd; font-weight: 400; }
        .input-field:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-light); }
        input[type="date"].input-field { min-height: 52px; }

        .pw-wrap { position: relative; margin-bottom: 14px; }
        .pw-wrap .input-field { margin-bottom: 0; padding-right: 48px; }
        .pw-wrap i { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 20px; color: var(--text-muted); cursor: pointer; }

        .btn-main {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #ffffff; border: none; border-radius: 999px;
            padding: 17px; width: 100%; font-size: 15px; font-weight: 600; font-family: inherit;
            cursor: pointer; transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 10px 22px rgba(14, 165, 233, 0.32); margin-top: 6px;
        }
        .btn-main:active { transform: scale(0.98); box-shadow: 0 5px 12px rgba(14, 165, 233, 0.3); }
        .btn-main:disabled { background: #cbd5e1; box-shadow: none; cursor: not-allowed; }

        .switch-link { margin-top: auto; padding-top: 26px; text-align: center; font-size: 13.5px; color: var(--text-muted); text-decoration: none; display: block; font-weight: 500; }
        .switch-link span { color: var(--brand-slate); font-weight: 700; }

        .row-2 { display: flex; gap: 12px; }
        .row-2 > div { flex: 1; min-width: 0; }

        #password-checklist { list-style: none; padding: 0; margin: 0 0 20px; display: flex; flex-wrap: wrap; gap: 8px; font-size: 12px; color: var(--text-muted); font-weight: 600; }
        #password-checklist li { background: #fff; padding: 6px 12px; border-radius: 999px; box-shadow: 0 2px 8px rgba(23, 32, 51, 0.06); }

        .file-upload-box {
            border: 1.5px dashed #c5cedc; background: #ffffff; border-radius: 16px;
            padding: 24px 20px; text-align: center; margin-bottom: 20px; color: var(--text-main);
            position: relative; transition: 0.2s; box-shadow: 0 4px 16px rgba(23, 32, 51, 0.05);
        }
        .file-upload-box:hover { border-color: var(--primary); background: var(--primary-light); }
        .file-upload-box i { font-size: 28px; margin-bottom: 8px; display: block; color: var(--primary); }
        .file-upload-box p { margin: 0; font-size: 13px; font-weight: 600; color: var(--text-muted); word-break: break-all; }
        .file-upload-box input[type="file"] { position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }

        .checkbox-container {
            display: flex; align-items: flex-start; gap: 12px; margin-bottom: 22px;
            background: #fff; padding: 16px; border-radius: 16px; box-shadow: 0 4px 16px rgba(23, 32, 51, 0.05);
        }
        .checkbox-container input { margin-top: 3px; transform: scale(1.2); accent-color: var(--primary); }
        .checkbox-container label { font-size: 13px; color: var(--text-muted); line-height: 1.5; font-weight: 500; }
</style>
</head>
<body>

    <div class="hero">
        <svg class="hero-curve" viewBox="0 0 390 300" preserveAspectRatio="none" aria-hidden="true">
            <defs>
                <linearGradient id="heroGrad" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#2c3850"/>
                    <stop offset="60%" stop-color="#3F4D67"/>
                    <stop offset="100%" stop-color="#4a5c7c"/>
                </linearGradient>
            </defs>
            <path d="M0,0 H390 V70 C382,190 305,282 190,288 C108,292 44,252 0,205 Z" fill="url(#heroGrad)"/>
            <circle cx="345" cy="40" r="90" fill="rgba(255,255,255,0.06)"/>
            <circle cx="30" cy="225" r="70" fill="rgba(14,165,233,0.16)"/>
        </svg>
        <a href="login.html" class="back-btn"><i class="ti ti-arrow-left"></i></a>
        <div class="hero-inner">
            <div class="brand">Coastal<br>Land Watch</div>
            <p>Join Barangay Tanza's Watch</p>
        </div>
    </div>

    <div class="page">
        <h2>Create Account</h2>

        <form id="mobileRegisterForm">

            <label class="input-label">Full Name</label>
            <input type="text" id="reg_fullname" class="input-field" placeholder="e.g. Juan Dela Cruz" required>

            <label class="input-label">Username</label>
            <input type="text" id="reg_username" class="input-field" placeholder="Choose a username" required>

            <label class="input-label">Password</label>
            <div class="pw-wrap">
                <input type="password" id="reg_password" class="input-field" placeholder="••••••••" required>
                <i class="ti ti-eye" id="togglePassword"></i>
            </div>
            <ul id="password-checklist">
                <li id="req-length">☐ At least 8 characters</li>
                <li id="req-letter">☐ Contains a letter</li>
                <li id="req-number">☐ Contains a number</li>
            </ul>

            <div class="row-2">
                <div>
                    <label class="input-label">Phone Number</label>
                    <input type="tel" id="reg_phone" class="input-field" placeholder="09XX XXX XXXX" maxlength="11" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 11);" required>
                </div>
                <div>
                    <label class="input-label">Date of Birth</label>
                    <input type="date" id="reg_dob" class="input-field" required>
                </div>
            </div>

            <label class="input-label">Address / Purok / Sitio</label>
            <input type="text" id="reg_address" class="input-field" placeholder="e.g. Sitio Gulod, Purok 2" required>

            <label class="input-label">Upload Valid ID</label>
            <div class="file-upload-box">
                <i class="ti ti-id"></i>
                <p id="fileNameDisplay">Tap to upload Barangay or Gov ID</p>
                <input type="file" id="reg_id_photo" accept="image/jpeg, image/png" required onchange="document.getElementById('fileNameDisplay').innerText = this.files[0].name">
            </div>

            <div class="checkbox-container">
                <input type="checkbox" id="reg_terms" required>
                <label for="reg_terms">I agree to the Terms of Service and Privacy Policy. I understand my account must be approved by an Admin.</label>
            </div>

            <button type="submit" class="btn-main">Register Account</button>

            <a href="login.html" class="switch-link">Already have an account? <span>Log In</span></a>
        </form>
    </div>

   <script>
        document.getElementById('mobileRegisterForm').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            const passVal = document.getElementById('reg_password').value;
            const phoneVal = document.getElementById('reg_phone').value.trim();

            if (!/^09\d{9}$/.test(phoneVal)) {
                alert("⚠️ Please enter a valid 11-digit Philippine mobile number starting with 09 (e.g., 09171234567).");
                return;
            }
            if (passVal.length < 8 || !/[a-zA-Z]/.test(passVal) || !/[0-9]/.test(passVal)) {
                alert("⚠️ Your password must meet all the checklist requirements!");
                return;
            }


            const submitBtn = document.querySelector('.btn-main');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = "Processing...";
            submitBtn.disabled = true;

            let formData = new FormData();
            formData.append('full_name', document.getElementById('reg_fullname').value);
            formData.append('username', document.getElementById('reg_username').value);
            formData.append('password', document.getElementById('reg_password').value);
            formData.append('phone_number', document.getElementById('reg_phone').value);
            formData.append('dob', document.getElementById('reg_dob').value);
            formData.append('address', document.getElementById('reg_address').value);
            
            const fileInput = document.getElementById('reg_id_photo');
            if (fileInput.files.length > 0) { formData.append('valid_id', fileInput.files[0]); }

            try {
                let response = await fetch('https://unaired-undrilled-shortly.ngrok-free.dev/coastal_land_watch/api_register.php', {
                    method: 'POST',
                    headers: { 'ngrok-skip-browser-warning': 'true' },
                    body: formData
                });

                let result = await response.json();

                if (result.status === 'success') {
                    await alert('🎉 ' + result.message);
                    window.location.href = "login.html";
                } else {
                    alert('⚠️ Error: ' + result.message);
                }
            } catch (error) {
                alert("System Error: Could not connect to the server.");
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });
    </script>

    <script>
    const passwordInput = document.getElementById('reg_password');
    const reqLength = document.getElementById('req-length');
    const reqLetter = document.getElementById('req-letter');
    const reqNumber = document.getElementById('req-number');

    passwordInput.addEventListener('input', function() {
        const val = passwordInput.value;
        if(val.length >= 8) { reqLength.innerHTML = '✅ At least 8 characters'; reqLength.style.color = 'var(--primary)'; } 
        else { reqLength.innerHTML = '☐ At least 8 characters'; reqLength.style.color = 'var(--text-muted)'; }
        
        if(/[a-zA-Z]/.test(val)) { reqLetter.innerHTML = '✅ Contains a letter'; reqLetter.style.color = 'var(--primary)'; } 
        else { reqLetter.innerHTML = '☐ Contains a letter'; reqLetter.style.color = 'var(--text-muted)'; }
        
        if(/[0-9]/.test(val)) { reqNumber.innerHTML = '✅ Contains a number'; reqNumber.style.color = 'var(--primary)'; } 
        else { reqNumber.innerHTML = '☐ Contains a number'; reqNumber.style.color = 'var(--text-muted)'; }
    });

    const togglePassword = document.getElementById('togglePassword');
    togglePassword.addEventListener('click', function () {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
        this.classList.toggle('ti-eye');
        this.classList.toggle('ti-eye-off');
    });
</script>

</body>
</html>
