<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Register - Coastal Land Watch</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">

    <style>
        /* ============================================
           BOLD & ELEVATED MINIMALIST DESIGN
        ============================================= */
        :root {
            --color-bg: #EAECEF; /* Darker gray background */
            --color-primary: #000000; /* Pure Black */
            --color-accent: #F3F4F6; /* Light gray inputs */
            --color-text-main: #111111;
            --color-text-muted: #555555;
        }

        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background-color: var(--color-bg); 
            margin: 0; 
            padding: 0;
            overflow-y: auto; 
            overflow-x: hidden;
        }

        /* ⚪ Clean Header */
        .header-bg {
            background: var(--color-bg);
            padding: 50px 20px 30px;
            text-align: center;
            position: relative;
        }

        /* Back Button */
        .back-btn {
            position: absolute;
            top: 25px;
            left: 20px;
            color: var(--color-text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 15px;
            font-weight: 800;
            background: #fff;
            padding: 8px 14px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .logo-box {
            width: 70px; 
            height: 70px; 
            border-radius: 20px; 
            background: var(--color-primary);
            margin: 0 auto 15px; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .logo-box i { font-size: 34px; color: #fff; }
        .header-bg h1 { color: var(--color-primary); font-size: 26px; margin: 0; font-weight: 800; letter-spacing: -0.5px; }
        .header-bg p { color: var(--color-text-muted); font-size: 14px; margin: 6px 0 0; font-weight: 600; }

        /* 📝 The Form Body (Nasa loob ng puting floating card) */
        .register-body { 
            background: #ffffff;
            border-top-left-radius: 35px;
            border-top-right-radius: 35px;
            padding: 40px 24px 60px; 
            box-shadow: 0 -10px 30px rgba(0,0,0,0.05);
            min-height: 100vh;
        }

        .input-label { font-size: 14px; font-weight: 800; color: var(--color-text-main); margin: 0 0 8px; display: block; }
        
        .input-field {
            background: var(--color-accent); 
            border: 2px solid transparent; 
            border-radius: 14px;
            padding: 18px; 
            font-size: 15px; 
            font-weight: 500;
            color: var(--color-text-main);
            width: 100%; 
            box-sizing: border-box; 
            margin-bottom: 20px;
            font-family: inherit;
            transition: 0.2s;
        }
        .input-field:focus { outline: none; border-color: var(--color-primary); background: #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }

        .row-2 { display: flex; gap: 12px; }
        .row-2 > div { flex: 1; }

        /* 📁 Bold File Upload Box */
        .file-upload-box {
            border: 2px dashed #9CA3AF;
            background: var(--color-accent);
            border-radius: 16px;
            padding: 25px 20px;
            text-align: center;
            margin-bottom: 24px;
            color: var(--color-text-main);
            position: relative;
            transition: 0.2s;
        }
        .file-upload-box:hover { border-color: var(--color-primary); background: #fff; }
        .file-upload-box i { font-size: 32px; margin-bottom: 8px; display: block; }
        .file-upload-box p { margin: 0; font-size: 14px; font-weight: 700; color: var(--color-text-muted); }
        .file-upload-box input[type="file"] {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer;
        }

        /* Checkbox */
        .checkbox-container {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 30px;
            background: #F9FAFB;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid #E5E7EB;
        }
        .checkbox-container input { margin-top: 3px; transform: scale(1.3); accent-color: var(--color-primary); }
        .checkbox-container label { font-size: 13px; color: var(--color-text-muted); line-height: 1.5; font-weight: 600; }

        /* 🔘 Solid Black Button */
        .btn-black {
            background: var(--color-primary); 
            color: #fff; 
            border: none; 
            border-radius: 16px;
            padding: 18px; 
            width: 100%; 
            font-size: 16px; 
            font-weight: 800; 
            margin-bottom: 20px; 
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }
        .btn-black:active { transform: scale(0.96); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        .login-link { 
            text-align: center; 
            font-size: 15px; 
            color: var(--color-text-muted); 
            text-decoration: none; 
            display: block; 
            font-weight: 600;
        }
        .login-link span { color: var(--color-primary); font-weight: 800; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="header-bg">
        <a href="login.html" class="back-btn"><i class="ti ti-arrow-left"></i> Back</a>
        <div class="logo-box">
            <i class="ti ti-user-plus"></i>
        </div>
        <h1>Create Account</h1>
        <p>Join Barangay Tanza's Watch</p>
    </div>

    <div class="register-body">
        <form id="mobileRegisterForm">
            
            <label class="input-label">Full Name</label>
            <input type="text" id="reg_fullname" class="input-field" placeholder="e.g. Juan Dela Cruz" required>

            <div class="row-2">
                <div>
                    <label class="input-label">Username</label>
                    <input type="text" id="reg_username" class="input-field" placeholder="Username" required>
                </div>
                <div>
                    <label class="input-label">Password</label>
                    <input type="password" id="reg_password" class="input-field" placeholder="••••••••" required>
                </div>
            </div>

            <div class="row-2">
                <div>
                    <label class="input-label">Phone Number</label>
                    <input type="tel" id="reg_phone" class="input-field" placeholder="09XX XXX XXXX" required>
                </div>
                <div>
                    <label class="input-label">Date of Birth</label>
                    <input type="date" id="reg_dob" class="input-field" required>
                </div>
            </div>

            <label class="input-label">Address / Purok / Sitio</label>
            <input type="text" id="reg_address" class="input-field" placeholder="e.g. Sitio Gulod, Purok 2" required>

            <label class="input-label">Upload Valid ID</label>
            <div class="file-upload-box">
                <i class="ti ti-id"></i>
                <p id="fileNameDisplay">Tap to upload Barangay or Gov ID</p>
                <input type="file" id="reg_id_photo" accept="image/jpeg, image/png" required onchange="document.getElementById('fileNameDisplay').innerText = this.files[0].name">
            </div>

            <div class="checkbox-container">
                <input type="checkbox" id="reg_terms" required>
                <label for="reg_terms">I agree to the Terms of Service and Privacy Policy. I understand my account must be approved by an Admin.</label>
            </div>

            <button type="submit" class="btn-black">Register Account</button>

            <a href="login.html" class="login-link">Already have an account? <span>Log In</span></a>
        </form>
    </div>

    <script>
        document.getElementById('mobileRegisterForm').addEventListener('submit', async (e) => {
            e.preventDefault(); 
            
            // 1. Change the button to show it's loading (Updated selector to .btn-black)
            const submitBtn = document.querySelector('.btn-black');
            const originalText = submitBtn.innerHTML;
            submitBtn.innerHTML = "Processing...";
            submitBtn.disabled = true;

            // 2. Package all the data exactly like a real web form
            let formData = new FormData();
            formData.append('full_name', document.getElementById('reg_fullname').value);
            formData.append('username', document.getElementById('reg_username').value);
            formData.append('password', document.getElementById('reg_password').value);
            formData.append('phone_number', document.getElementById('reg_phone').value);
            formData.append('dob', document.getElementById('reg_dob').value);
            formData.append('address', document.getElementById('reg_address').value);
            
            // Grab the physical file the user selected
            const fileInput = document.getElementById('reg_id_photo');
            if (fileInput.files.length > 0) {
                formData.append('valid_id', fileInput.files[0]);
            }

            try {
                // 3. Shoot it through the Ngrok tunnel to your XAMPP laptop!
                // IMPORTANT: Make sure this link exactly matches your running Ngrok terminal
                let response = await fetch('https://unaired-undrilled-shortly.ngrok-free.dev/coastal_land_watch/api_register.php', {
                    method: 'POST',
                    headers: {
                        'ngrok-skip-browser-warning': 'true' // Bypass firewall
                    },
                    body: formData // The browser automatically handles the complex photo formatting!
                });

                let result = await response.json();

                if (result.status === 'success') {
                    alert('🎉 ' + result.message);
                    // Teleport them back to the login screen
                    window.location.href = "login.html";
                } else {
                    alert('⚠️ Error: ' + result.message);
                }

            } catch (error) {
                alert("System Error: Could not connect to the server. Make sure you have internet access and the server is running.");
                console.error(error);
            } finally {
                // Reset the button back to normal
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
